[DEFAULT]
# relative path is from the project root directory
logdir=logs
logfile=nmvs-bide.log

[loggers]
keys=root

[handlers]
keys=fileHandler

[formatters]
keys=standardFormatter

[logger_root]
level=DEBUG
handlers=fileHandler

[handler_fileHandler]
class=logging.handlers.RotatingFileHandler
level=DEBUG
formatter=standardFormatter
# args: (filename, mode, maxBytes, backupCount)
args=('%(logdir)s/%(logfile)s', 'a', 10485760, 5)

[formatter_standardFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

